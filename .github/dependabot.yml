version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "nuget"]
    groups:
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Pomelo.EntityFrameworkCore*"]
      testing:
        patterns: ["Microsoft.NET.Test*", "xunit*", "Moq"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
