syntax = "proto3";
package Protocol;

message RealmServerInfo
{
    int32 realmId = 1;
    string realmName = 2;
    int32 currentPlayers = 3;
    int32 maxPlayers = 4;
    int32 status = 5;
}

message GameSessionInfo
{
    uint64 accountId = 1;
    uint64 gatewaySessionId = 2;
    int32 gatewayServerId = 3;
}
