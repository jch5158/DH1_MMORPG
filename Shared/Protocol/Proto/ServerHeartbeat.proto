syntax = "proto3";
package Protocol;

import "PacketOption.proto";

option (service_type) = SERVICE_TYPE_SERVER_HEARTBEAT;
option (handler_name) = "ServerHeartbeatPacketHandler";

message S2S_HEARTBEAT_NOT
{
    option (sender) = SERVER;
    option (receiver) = SERVER;

    int32 serverType = 1;
    int32 serverId = 2;
    int64 timestamp = 3;
    int32 sessionCount = 4;
    int32 status = 5;
}
