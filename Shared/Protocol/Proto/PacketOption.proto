syntax = "proto3";
package Protocol;

import "Enum.proto";
import "google/protobuf/descriptor.proto";

extend google.protobuf.FileOptions 
{
    eServiceType service_type = 50001;
    string handler_name = 50002;
}

extend google.protobuf.MessageOptions 
{
    int32 packet_id = 50003;
    eRole sender = 50004;
    repeated eRole receiver = 50005;
}